services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: ${DB_NAME:-inventory_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_PLATFORM_API_URL: ${REACT_APP_PLATFORM_API_URL:-/api/platform}
        REACT_APP_ML_API_URL: ${REACT_APP_ML_API_URL:-http://localhost:8000}
        REACT_APP_ENV: ${REACT_APP_ENV:-production}
    image: inventory-system-web:latest
    container_name: inventory-app-prod
    environment:
      NODE_ENV: production
      AUTO_INIT_DB: ${AUTO_INIT_DB:-true}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventory_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - inventory-network

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    image: inventory-ml-service:latest
    container_name: inventory-ml-service-prod
    environment:
      MODEL_DIR: /app/models
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  db-init:
    image: inventory-system-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_PLATFORM_API_URL: ${REACT_APP_PLATFORM_API_URL:-/api/platform}
        REACT_APP_ML_API_URL: ${REACT_APP_ML_API_URL:-http://localhost:8000}
        REACT_APP_ENV: ${REACT_APP_ENV:-production}
    profiles:
      - init
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventory_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      DB_SSL: "false"
    command: npm --workspace backend run db:init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network

volumes:
  postgres_data:
    driver: local

networks:
  inventory-network:
    driver: bridge
