openapi: 3.0.3
info:
  title: Inventory System Backend API
  version: 1.0.0
  description: "API documentation for the inventory web backend. All successful responses use `{ success: true, data, error: null }`."
servers:
  - url: http://localhost:5000
    description: Local backend
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Products
  - name: Sales
  - name: Movements
  - name: Notifications
  - name: Reports
  - name: Platform
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      security: []
      summary: Backend health check
      responses:
        "200":
          description: Backend is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register store owner or admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login by email or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Requires role `admin` or `owner`.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      summary: Create employee user
      description: Requires role `admin` or `owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/users/{id}:
    put:
      tags: [Users]
      summary: Update employee user
      description: Requires role `admin` or `owner`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Users]
      summary: Delete employee user
      description: Requires role `admin` or `owner`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/products:
    get:
      tags: [Products]
      summary: List products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
    post:
      tags: [Products]
      summary: Create product
      description: Requires role `manager`, `owner` or `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "409":
          $ref: "#/components/responses/Error"

  /api/products/left:
    get:
      tags: [Products]
      summary: List products with total stock quantity
      responses:
        "200":
          description: Products with quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/products/low-stock:
    get:
      tags: [Products]
      summary: List products at or below minimum stock
      description: Requires role `manager`, `owner` or `admin`.
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/products/barcode/{code}:
    get:
      tags: [Products]
      summary: Get product by barcode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/products/import:
    post:
      tags: [Products]
      summary: Bulk import products
      description: Requires role `manager`, `owner` or `admin`. Maximum 1000 products.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProductImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Products]
      summary: Update product
      description: Requires role `manager`, `owner` or `admin`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
    delete:
      tags: [Products]
      summary: Delete product
      description: Requires role `owner` or `admin`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/sales:
    post:
      tags: [Sales]
      summary: Create sale
      description: Requires role `cashier`, `manager`, `owner` or `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCreateRequest"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          $ref: "#/components/responses/Error"

  /api/sales/daily:
    get:
      tags: [Sales]
      summary: Daily sales analytics
      description: Requires role `owner` or `admin`.
      responses:
        "200":
          description: Daily sales data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/sales/weekly:
    get:
      tags: [Sales]
      summary: Weekly sales analytics
      description: Requires role `owner` or `admin`.
      responses:
        "200":
          description: Weekly sales data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/sales/monthly:
    get:
      tags: [Sales]
      summary: Monthly sales analytics
      description: Requires role `owner` or `admin`.
      responses:
        "200":
          description: Monthly sales data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/sales/chart:
    get:
      tags: [Sales]
      summary: Sales chart data
      description: Requires role `owner` or `admin`.
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale with items
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sale details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/sales/{id}/return:
    post:
      tags: [Sales]
      summary: Return sale
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id]
              properties:
                warehouse_id:
                  type: integer
      responses:
        "200":
          description: Sale returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/movements:
    get:
      tags: [Movements]
      summary: List stock movements
      description: Requires role `manager`, `owner` or `admin`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: product_id
          in: query
          schema:
            type: integer
        - name: warehouse_id
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [IN, OUT, TRANSFER, SALE, RETURN]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Movement list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/movements/in:
    post:
      tags: [Movements]
      summary: Add stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInRequest"
      responses:
        "201":
          description: Stock added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/movements/out:
    post:
      tags: [Movements]
      summary: Remove stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementOutRequest"
      responses:
        "201":
          description: Stock removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/movements/transfer:
    post:
      tags: [Movements]
      summary: Transfer stock between warehouses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementTransferRequest"
      responses:
        "201":
          description: Stock transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications
      description: Requires role `owner` or `manager`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, UNREAD, READ]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/Error"

  /api/reports/sales:
    get:
      tags: [Reports]
      summary: Sales report for export
      description: Requires role `owner` or `admin`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-04-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-04-30"
      responses:
        "200":
          description: Sales report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/auth/login:
    post:
      tags: [Platform]
      security: []
      summary: Platform login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Platform authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /api/platform/auth/logout:
    post:
      tags: [Platform]
      summary: Platform logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/auth/me:
    get:
      tags: [Platform]
      summary: Platform current user
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/platform/stores:
    get:
      tags: [Platform]
      summary: List platform stores
      responses:
        "200":
          description: Store list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      tags: [Platform]
      summary: Create platform store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateRequest"
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}:
    get:
      tags: [Platform]
      summary: Get platform store details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      tags: [Platform]
      summary: Soft delete store
      description: Marks the store as deleted without removing the store row or related tenant data.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store marked as deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}/suspend:
    post:
      tags: [Platform]
      summary: Suspend store
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}/resume:
    post:
      tags: [Platform]
      summary: Resume store
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}/archive:
    post:
      tags: [Platform]
      summary: Archive store
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}/health:
    get:
      tags: [Platform]
      summary: Get store health
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/stores/{id}/activity:
    get:
      tags: [Platform]
      summary: Get store activity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Store activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/health/backend:
    get:
      tags: [Platform]
      security: []
      summary: Backend health for platform dashboard
      responses:
        "200":
          description: Backend health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/health/database:
    get:
      tags: [Platform]
      security: []
      summary: Database health for platform dashboard
      responses:
        "200":
          description: Database health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/health/system:
    get:
      tags: [Platform]
      security: []
      summary: System health for platform dashboard
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/logs:
    get:
      tags: [Platform]
      summary: Platform logs
      responses:
        "200":
          description: Log rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/activity:
    get:
      tags: [Platform]
      summary: Platform activity feed
      responses:
        "200":
          description: Activity rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/metrics/summary:
    get:
      tags: [Platform]
      summary: Platform metrics summary
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/platform/metrics/growth:
    get:
      tags: [Platform]
      summary: Platform metrics growth
      responses:
        "200":
          description: Metrics growth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SuccessResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        error:
          nullable: true
          example: null
    ErrorResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
          example: null
        error:
          type: string
          example: Invalid request
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  $ref: "#/components/schemas/User"
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/User"
                - type: object
                  properties:
                    user:
                      $ref: "#/components/schemas/User"
    LoginRequest:
      type: object
      required: [password]
      properties:
        login:
          type: string
          description: Email or phone. Alternative to `email`.
        email:
          type: string
          format: email
          description: Alternative to `login`.
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [storeName, firstName, lastName, contact, password]
      properties:
        storeName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        contact:
          type: string
          description: Email or phone.
        password:
          type: string
          format: password
        passwordConfirm:
          type: string
          format: password
        role:
          type: string
          enum: [owner, admin]
          default: owner
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        store_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [cashier, manager, owner, admin]
        created_at:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [firstName, lastName, contact, role, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        contact:
          type: string
          description: Email or phone.
        role:
          type: string
          enum: [cashier, manager, admin]
        password:
          type: string
          format: password
    UserUpdateRequest:
      type: object
      required: [role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        contact:
          type: string
        role:
          type: string
          enum: [cashier, manager, admin]
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        category:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        purchase_price:
          type: number
          format: float
        sale_price:
          type: number
          format: float
        min_stock:
          type: integer
        quantity:
          type: integer
          description: Present on stock endpoints.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Product"
    ProductInput:
      type: object
      required: [name, sku, purchase_price, sale_price]
      properties:
        name:
          type: string
        sku:
          type: string
        category:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        purchase_price:
          type: number
          format: float
          minimum: 0
        sale_price:
          type: number
          format: float
          minimum: 0
        min_stock:
          type: integer
          minimum: 0
          default: 0
    ProductImportInput:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
