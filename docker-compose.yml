services:
  # PostgreSQL database (optional, for dev/testing)
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_here
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # Backend API server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres_password_here
      JWT_SECRET: dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/.env:/app/backend/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network
    command: npm --workspace backend run dev

  # Frontend development server (optional, can run separately)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: inventory-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_PLATFORM_API_URL: http://localhost:5000/api/platform
      REACT_APP_ENV: local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    depends_on:
      - backend
    networks:
      - inventory-network
    command: npm --workspace frontend run start

volumes:
  postgres_data:
    driver: local

networks:
  inventory-network:
    driver: bridge

# Quick start guide:
#   1. Copy .env.example to backend/.env and frontend/.env (if needed)
#   2. Run: docker-compose up
#   3. Backend: http://localhost:5000
#   4. Frontend: http://localhost:3000
#   5. Database: localhost:5432 (postgres / postgres_password_here)
#
# Stop services:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f [service-name]
#
# For local development without containers, run:
#   npm run dev
