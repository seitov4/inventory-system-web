services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_here
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # Backend API server + compiled React frontend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_PLATFORM_API_URL: /api/platform
        REACT_APP_ML_API_URL: ${REACT_APP_ML_API_URL:-http://localhost:8000}
        REACT_APP_ENV: production
    container_name: inventory-backend
    environment:
      NODE_ENV: production
      AUTO_INIT_DB: "true"
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres_password_here
      DB_SSL: "false"
      JWT_SECRET: dev-secret-key-change-in-production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,https://*.ngrok-free.dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_CHAT_USER_HOURLY_LIMIT: ${AI_CHAT_USER_HOURLY_LIMIT:-20}
      AI_CHAT_STORE_DAILY_LIMIT: ${AI_CHAT_STORE_DAILY_LIMIT:-100}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - inventory-network
    command: npm --workspace backend run start

  # ML forecast API
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: inventory-ml-service
    environment:
      MODEL_DIR: /app/models
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

volumes:
  postgres_data:
    driver: local

networks:
  inventory-network:
    driver: bridge

# Quick start guide:
#   1. Run: docker compose up -d --build
#   2. App: http://localhost:5000
#   3. API: http://localhost:5000/api/health
#   4. Database: localhost:5432 (postgres / postgres_password_here)
#
# Stop services:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f [service-name]
#
# For local development without containers, run:
#   npm run dev
